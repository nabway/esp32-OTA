[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
#upload_speed   = 921600

# Using the SDK default partition table (contains OTA slots). To use a
# custom CSV, set `board_build.partitions` to its path.

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -I include

lib_deps =
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    adafruit/Adafruit SSD1306 @ ^2.4.7
    adafruit/Adafruit GFX Library @ ^1.11.5